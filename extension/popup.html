<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>墨萃-InkGist</title>
  <style>
    body {
      width: 300px;
      padding: 16px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #0f172a;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e2e8f0;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
    }
    .desc {
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .stats {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
    }
    .btn {
      width: 100%;
      padding: 9px;
      background: #0f172a;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover {
      background: #1e293b;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon48.png" width="20" height="20" style="border-radius: 4px;" alt="logo" />
    <span class="title">墨萃-InkGist</span>
  </div>
  <p class="desc">直接读取您当前浏览器收藏夹的所有网址，一键传输至墨萃进行 AI 深度智能速读。</p>
  <div class="stats">
    <span>已读取有效书签：</span>
    <strong id="count">正在检测...</strong>
  </div>
  <button id="importBtn" class="btn">
    <span>导入墨萃进行 AI 总结</span>
  </button>
  <script src="popup.js"></script>
</body>
</html>
